<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">pi-duo 宣传图</title>
  <desc id="desc">一个 Pi，两个持久智能体。Austin 前台实现，Tony 后台审查。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.48" stop-color="#10102a"/>
      <stop offset="1" stop-color="#071c22"/>
    </linearGradient>
    <radialGradient id="auraA" cx="0" cy="0" r="1" gradientTransform="translate(230 375) rotate(28) scale(530 470)">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB" cx="0" cy="0" r="1" gradientTransform="translate(860 780) rotate(145) scale(540 500)">
      <stop offset="0" stop-color="#19e6c8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#19e6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset=".52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#37f3d1"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#281a51"/>
      <stop offset="1" stop-color="#12182a"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#093d3c"/>
      <stop offset="1" stop-color="#101b29"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#99a6c7" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glowPurple" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="b"/>
      <feFlood flood-color="#9f7aea" flood-opacity=".7"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMint" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feFlood flood-color="#27e8c7" flood-opacity=".65"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <clipPath id="round"><rect width="1080" height="1440" rx="44"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1080" height="1440" fill="url(#bg)"/>
    <rect width="1080" height="1440" fill="url(#auraA)"/>
    <rect width="1080" height="1440" fill="url(#auraB)"/>
    <rect width="1080" height="1440" fill="url(#grid)"/>

    <g opacity=".35">
      <path d="M-80 226H360L492 94H760" fill="none" stroke="#ad91ff" stroke-width="2"/>
      <path d="M740 1346H936L1120 1162" fill="none" stroke="#2ce7c9" stroke-width="2"/>
      <circle cx="361" cy="225" r="6" fill="#ad91ff"/>
      <circle cx="936" cy="1346" r="6" fill="#2ce7c9"/>
    </g>

    <g font-family="Inter, SF Pro Display, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
      <g transform="translate(72 70)">
        <rect width="290" height="54" rx="27" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/>
        <circle cx="28" cy="27" r="7" fill="#39f0d0" filter="url(#glowMint)"/>
        <text x="50" y="35" fill="#dce7ff" font-size="22" font-weight="650" letter-spacing="2">PI CODING AGENT</text>
      </g>

      <text x="70" y="230" fill="#f5f7ff" font-size="74" font-weight="800" letter-spacing="1">一个 Pi</text>
      <text x="70" y="322" fill="url(#logo)" font-size="108" font-weight="900" letter-spacing="-3" filter="url(#glowPurple)">两个大脑</text>
      <text x="74" y="378" fill="#aeb9d5" font-size="28" font-weight="500" letter-spacing="4">PERSISTENT PEER AGENTS</text>

      <g transform="translate(70 445)" filter="url(#shadow)">
        <g transform="rotate(-2 235 236)">
          <rect width="465" height="474" rx="36" fill="url(#cardA)" stroke="#9b7af2" stroke-opacity=".72" stroke-width="2"/>
          <rect x="24" y="24" width="124" height="38" rx="19" fill="#9f7aea" fill-opacity=".18"/>
          <text x="48" y="50" fill="#cfc0ff" font-size="20" font-weight="750" letter-spacing="2">FOREGROUND</text>
          <circle cx="232" cy="160" r="76" fill="#9f7aea" fill-opacity=".13" stroke="#ad91ff" stroke-width="3"/>
          <text x="232" y="192" text-anchor="middle" fill="#d8ccff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="94" font-weight="800" filter="url(#glowPurple)">A</text>
          <text x="232" y="290" text-anchor="middle" fill="#ffffff" font-size="43" font-weight="820">Austin</text>
          <text x="232" y="338" text-anchor="middle" fill="#b9bed2" font-size="26" font-weight="550">前台实现 · 唯一写入者</text>
          <path d="M89 385H375" stroke="#8d77cc" stroke-opacity=".55"/>
          <text x="232" y="425" text-anchor="middle" fill="#d7d3e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">CODE  •  INTEGRATE  •  SHIP</text>
        </g>
      </g>

      <g transform="translate(545 470)" filter="url(#shadow)">
        <g transform="rotate(2 235 236)">
          <rect width="465" height="474" rx="36" fill="url(#cardB)" stroke="#31d8bd" stroke-opacity=".72" stroke-width="2"/>
          <rect x="24" y="24" width="132" height="38" rx="19" fill="#27e8c7" fill-opacity=".14"/>
          <text x="45" y="50" fill="#81f5df" font-size="20" font-weight="750" letter-spacing="2">BACKGROUND</text>
          <circle cx="232" cy="160" r="76" fill="#20d8b9" fill-opacity=".11" stroke="#31dfc2" stroke-width="3"/>
          <text x="232" y="192" text-anchor="middle" fill="#92ffe9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="94" font-weight="800" filter="url(#glowMint)">T</text>
          <text x="232" y="290" text-anchor="middle" fill="#ffffff" font-size="43" font-weight="820">Tony</text>
          <text x="232" y="338" text-anchor="middle" fill="#b9cfce" font-size="26" font-weight="550">后台调查 · 测试 · 审查</text>
          <path d="M89 385H375" stroke="#32bda8" stroke-opacity=".48"/>
          <text x="232" y="425" text-anchor="middle" fill="#c9e2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">TEST  •  CHALLENGE  •  REVIEW</text>
        </g>
      </g>

      <g transform="translate(70 1004)">
        <text x="0" y="0" fill="#ffffff" font-size="32" font-weight="780">独立会话</text>
        <text x="238" y="0" fill="#ffffff" font-size="32" font-weight="780">实时互审</text>
        <text x="476" y="0" fill="#ffffff" font-size="32" font-weight="780">默认单写者</text>
        <text x="750" y="0" fill="#ffffff" font-size="32" font-weight="780">随时恢复</text>
        <rect x="0" y="20" width="145" height="5" rx="2.5" fill="#9f7aea"/>
        <rect x="238" y="20" width="145" height="5" rx="2.5" fill="#7d8fff"/>
        <rect x="476" y="20" width="177" height="5" rx="2.5" fill="#3fd5c1"/>
        <rect x="750" y="20" width="145" height="5" rx="2.5" fill="#31e3c4"/>
      </g>

      <g transform="translate(70 1082)">
        <rect width="940" height="142" rx="28" fill="#050a12" fill-opacity=".7" stroke="#8c98b8" stroke-opacity=".28"/>
        <circle cx="32" cy="30" r="6" fill="#ff6b81"/>
        <circle cx="54" cy="30" r="6" fill="#ffd166"/>
        <circle cx="76" cy="30" r="6" fill="#35e0bb"/>
        <text x="34" y="86" fill="#8793ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">›</text>
        <text x="70" y="86" fill="#f5f7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">/duo start --peer provider/model</text>
        <rect x="34" y="105" width="504" height="3" fill="#30e6c5" opacity=".75"/>
      </g>

      <g transform="translate(70 1280)">
        <text x="0" y="0" fill="url(#logo)" font-size="62" font-weight="900" letter-spacing="-2">PI-DUO</text>
        <text x="0" y="45" fill="#9da9c5" font-size="22" letter-spacing="1.5">TWO AGENTS. ONE SHARED GOAL.</text>
        <g transform="translate(620 -12)">
          <rect width="320" height="74" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
          <text x="160" y="31" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="720">github.com/atfa/pi-duo</text>
          <text x="160" y="57" text-anchor="middle" fill="#54e7cc" font-size="17" font-weight="600">安装 · 配置 · 完整文档</text>
        </g>
      </g>
    </g>

    <rect x="18" y="18" width="1044" height="1404" rx="34" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  </g>
</svg>
